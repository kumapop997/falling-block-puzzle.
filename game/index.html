<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>落ちモノパズル</title>
<style>
  :root {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --panel-border: #dde1ee;
    --text: #262a3d;
    --sub: #6b7290;
    --accent: #4a6cf7;
    --cell-empty: #eef1f9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at 50% 0%, #ffffff, #e7ebf6 70%);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    min-height: 100vh;
  }
  .layout {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 24px;
    padding: 24px 16px 60px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    margin: 0 0 16px;
    text-align: center;
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 10px 30px rgba(70,80,130,0.15);
  }
  canvas#board {
    display: block;
    background: var(--cell-empty);
    border-radius: 4px;
  }
  .side {
    width: 190px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: 0 8px 22px rgba(70,80,130,0.12);
  }
  .panel h2 {
    font-size: 0.78rem;
    margin: 0 0 8px;
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #next {
    display: block;
    margin: 0 auto;
    background: var(--cell-empty);
    border-radius: 6px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.95rem;
    padding: 3px 0;
  }
  .stat-row span:first-child { color: var(--sub); }
  .stat-row span:last-child { font-weight: 600; }
  .controls-list {
    font-size: 0.8rem;
    color: var(--sub);
    line-height: 1.7;
    margin: 0;
    padding-left: 0;
    list-style: none;
  }
  .controls-list b { color: var(--text); }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: filter 0.15s ease, transform 0.05s ease;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(0.97); }
  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  .overlay[hidden] { display: none !important; }
  .overlay h2 {
    font-size: 1.4rem;
    margin: 0;
  }
  .overlay p {
    margin: 0;
    color: var(--sub);
    font-size: 0.9rem;
  }
  .overlay button {
    width: auto;
    padding: 10px 26px;
  }
  .title-screen {
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(236,240,252,0.97));
    gap: 18px;
  }
  .title-blocks {
    display: flex;
    gap: 4px;
  }
  .title-blocks span {
    width: 18px;
    height: 18px;
    border-radius: 3px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.35), inset 0 0 0 1px rgba(0,0,0,0.2);
    animation: bob 1.6s ease-in-out infinite;
  }
  .title-blocks span:nth-child(2) { animation-delay: 0.1s; }
  .title-blocks span:nth-child(3) { animation-delay: 0.2s; }
  .title-blocks span:nth-child(4) { animation-delay: 0.3s; }
  .title-blocks span:nth-child(5) { animation-delay: 0.4s; }
  .title-blocks span:nth-child(6) { animation-delay: 0.5s; }
  .title-blocks span:nth-child(7) { animation-delay: 0.6s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .overlay h2.game-title {
    font-size: 2.3rem;
    line-height: 1.15;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #4a6cf7, #b46be0 55%, #f4564f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .combo-popup {
    position: absolute;
    left: 0;
    right: 0;
    top: 38%;
    text-align: center;
    pointer-events: none;
  }
  .combo-popup strong {
    display: block;
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #4a6cf7, #b46be0 55%, #f4564f);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .combo-popup span {
    font-size: 1rem;
    font-weight: 700;
    color: #b46be0;
  }
  .combo-popup.show {
    animation: comboPop 1s ease-out forwards;
  }
  @keyframes comboPop {
    0% { opacity: 0; transform: scale(0.6); }
    15% { opacity: 1; transform: scale(1.15); }
    30% { transform: scale(1); }
    75% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-24px); }
  }
  .overlay p.title-sub {
    margin-top: -10px;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
  }
  .hiscore-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 22px;
    min-width: 170px;
  }
  .hiscore-box span {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--sub);
  }
  .hiscore-box strong {
    font-size: 1.5rem;
    color: var(--text);
  }
  .overlay button.big {
    font-size: 1.1rem;
    padding: 12px 44px;
  }
  .overlay p.hint { font-size: 0.75rem; }
  .overlay button.secondary {
    background: #eef1f9;
    color: var(--text);
    border: 1px solid var(--panel-border);
  }
  .new-record {
    color: #f0973b;
    font-weight: 800;
    letter-spacing: 0.1em;
    animation: bob 0.8s ease-in-out infinite;
  }
  .new-record[hidden] { display: none; }
  .touch-controls {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 4px;
  }
  .touch-controls button {
    padding: 14px 0;
    font-size: 1.1rem;
    background: #eef1f9;
    color: var(--text);
    border: 1px solid var(--panel-border);
  }
  @media (max-width: 720px) {
    .layout { flex-direction: column; align-items: center; }
    .side { width: 100%; max-width: 330px; flex-direction: row; flex-wrap: wrap; }
    .side .panel { flex: 1 1 140px; }
    .touch-controls { display: grid; }
  }
</style>
</head>
<body>

<div class="layout">
  <div>
    <h1>落ちモノパズル</h1>
    <div class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="combo-popup" id="comboPopup" hidden></div>
      <div class="overlay title-screen" id="startOverlay">
        <div class="title-blocks" aria-hidden="true">
          <span style="background:#4dd8e8"></span>
          <span style="background:#f5d547"></span>
          <span style="background:#b46be0"></span>
          <span style="background:#5fd97a"></span>
          <span style="background:#f4564f"></span>
          <span style="background:#4d7cf0"></span>
          <span style="background:#f0973b"></span>
        </div>
        <h2 class="game-title">落ちモノ<br>パズル</h2>
        <p class="title-sub">FALLING BLOCK PUZZLE</p>
        <div class="hiscore-box">
          <span>HIGH SCORE</span>
          <strong id="titleHighScore">0</strong>
        </div>
        <button id="startBtn" class="big">スタート</button>
        <p class="hint">Enterキーでもスタートできます</p>
      </div>
      <div class="overlay" id="gameOverOverlay" hidden>
        <h2>ゲームオーバー</h2>
        <div class="new-record" id="newRecord" hidden>★ NEW RECORD ★</div>
        <p id="finalScore">スコア: 0</p>
        <p id="finalHighScore">ハイスコア: 0</p>
        <p id="finalMaxCombo">最大コンボ: 0</p>
        <button id="retryBtn">もう一度</button>
        <button id="titleBtn" class="secondary">タイトルへ</button>
      </div>
      <div class="overlay" id="pauseOverlay" hidden>
        <h2>一時停止</h2>
        <button id="resumeBtn">再開</button>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Next</h2>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="panel">
      <h2>Status</h2>
      <div class="stat-row"><span>ハイスコア</span><span id="highScore">0</span></div>
      <div class="stat-row"><span>スコア</span><span id="score">0</span></div>
      <div class="stat-row"><span>ライン</span><span id="lines">0</span></div>
      <div class="stat-row"><span>レベル</span><span id="level">1</span></div>
      <div class="stat-row"><span>コンボ</span><span id="combo">0</span></div>
    </div>
    <div class="panel">
      <h2>操作</h2>
      <ul class="controls-list">
        <li><b>← →</b> : 移動</li>
        <li><b>↓</b> : ソフトドロップ</li>
        <li><b>↑ / X</b> : 右回転</li>
        <li><b>Z</b> : 左回転</li>
        <li><b>Space</b> : ハードドロップ</li>
        <li><b>P</b> : 一時停止</li>
      </ul>
      <div class="touch-controls">
        <button data-act="left">←</button>
        <button data-act="rotate">↻</button>
        <button data-act="right">→</button>
        <button data-act="down">↓</button>
        <button data-act="drop" style="grid-column: span 4;">ハードドロップ</button>
      </div>
    </div>
    <button id="pauseBtn">一時停止</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;

  const boardCanvas = document.getElementById("board");
  const ctx = boardCanvas.getContext("2d");
  const nextCanvas = document.getElementById("next");
  const nextCtx = nextCanvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const linesEl = document.getElementById("lines");
  const levelEl = document.getElementById("level");
  const finalScoreEl = document.getElementById("finalScore");
  const finalHighScoreEl = document.getElementById("finalHighScore");
  const highScoreEl = document.getElementById("highScore");
  const titleHighScoreEl = document.getElementById("titleHighScore");
  const newRecordEl = document.getElementById("newRecord");
  const comboEl = document.getElementById("combo");
  const comboPopupEl = document.getElementById("comboPopup");
  const finalMaxComboEl = document.getElementById("finalMaxCombo");

  const startOverlay = document.getElementById("startOverlay");
  const gameOverOverlay = document.getElementById("gameOverOverlay");
  const pauseOverlay = document.getElementById("pauseOverlay");

  const startBtn = document.getElementById("startBtn");
  const retryBtn = document.getElementById("retryBtn");
  const resumeBtn = document.getElementById("resumeBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const titleBtn = document.getElementById("titleBtn");

  const HIGH_SCORE_KEY = "fallingPuzzleHighScore";

  function loadHighScore() {
    try {
      return parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveHighScore(value) {
    try {
      localStorage.setItem(HIGH_SCORE_KEY, String(value));
    } catch (e) {
      // 保存できない環境(プライベートモード等)ではその回のみ保持
    }
  }

  let highScore = loadHighScore();

  function updateHighScoreDisplay() {
    highScoreEl.textContent = highScore;
    titleHighScoreEl.textContent = highScore;
  }

  const COLORS = {
    I: "#4dd8e8",
    O: "#f5d547",
    T: "#b46be0",
    S: "#5fd97a",
    Z: "#f4564f",
    J: "#4d7cf0",
    L: "#f0973b"
  };

  const SHAPES = {
    I: [
      [[0,1],[1,1],[2,1],[3,1]],
      [[2,0],[2,1],[2,2],[2,3]],
      [[0,2],[1,2],[2,2],[3,2]],
      [[1,0],[1,1],[1,2],[1,3]]
    ],
    O: [
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[2,1]]
    ],
    T: [
      [[1,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[2,1],[1,2]],
      [[1,0],[0,1],[1,1],[1,2]]
    ],
    S: [
      [[1,0],[2,0],[0,1],[1,1]],
      [[1,0],[1,1],[2,1],[2,2]],
      [[1,1],[2,1],[0,2],[1,2]],
      [[0,0],[0,1],[1,1],[1,2]]
    ],
    Z: [
      [[0,0],[1,0],[1,1],[2,1]],
      [[2,0],[1,1],[2,1],[1,2]],
      [[0,1],[1,1],[1,2],[2,2]],
      [[1,0],[0,1],[1,1],[0,2]]
    ],
    J: [
      [[0,0],[0,1],[1,1],[2,1]],
      [[1,0],[2,0],[1,1],[1,2]],
      [[0,1],[1,1],[2,1],[2,2]],
      [[1,0],[1,1],[0,2],[1,2]]
    ],
    L: [
      [[2,0],[0,1],[1,1],[2,1]],
      [[1,0],[1,1],[1,2],[2,2]],
      [[0,1],[1,1],[2,1],[0,2]],
      [[0,0],[1,0],[1,1],[1,2]]
    ]
  };

  const TYPES = Object.keys(SHAPES);

  function newBag() {
    const bag = [...TYPES];
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
    return bag;
  }

  let grid, bag, current, nextType, score, lines, level, dropInterval,
      dropTimer, running, paused, gameOver, lastTime, rafId,
      combo, maxCombo;

  function createGrid() {
    return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  }

  function drawBlock(context, x, y, color, size) {
    const px = x * size, py = y * size;
    context.fillStyle = color;
    context.fillRect(px, py, size, size);
    context.strokeStyle = "rgba(0,0,0,0.35)";
    context.lineWidth = 1;
    context.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
    context.fillStyle = "rgba(255,255,255,0.18)";
    context.fillRect(px, py, size, Math.max(2, size * 0.18));
  }

  function spawnPiece(type) {
    return {
      type,
      rotation: 0,
      x: 3,
      y: -2
    };
  }

  function getCells(piece) {
    return SHAPES[piece.type][piece.rotation].map(([dx, dy]) => [piece.x + dx, piece.y + dy]);
  }

  function collides(piece, dx, dy, rotation) {
    const rot = rotation === undefined ? piece.rotation : rotation;
    const testPiece = { ...piece, x: piece.x + dx, y: piece.y + dy, rotation: rot };
    return getCells(testPiece).some(([x, y]) => {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y < 0) return false;
      return grid[y][x] !== null;
    });
  }

  function drawGrid() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const cell = grid[y][x];
        if (cell) {
          drawBlock(ctx, x, y, cell, CELL);
        } else {
          ctx.strokeStyle = "rgba(70,80,130,0.08)";
          ctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
        }
      }
    }
  }

  function drawGhost() {
    let ghostY = 0;
    while (!collides(current, 0, ghostY + 1)) ghostY++;
    const ghostPiece = { ...current, y: current.y + ghostY };
    getCells(ghostPiece).forEach(([x, y]) => {
      if (y < 0) return;
      ctx.save();
      ctx.globalAlpha = 0.25;
      drawBlock(ctx, x, y, COLORS[current.type], CELL);
      ctx.restore();
    });
  }

  function drawCurrent() {
    getCells(current).forEach(([x, y]) => {
      if (y < 0) return;
      drawBlock(ctx, x, y, COLORS[current.type], CELL);
    });
  }

  function drawNext() {
    nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextType) return;
    const cells = SHAPES[nextType][0];
    const size = 24;
    const minX = Math.min(...cells.map(c => c[0]));
    const maxX = Math.max(...cells.map(c => c[0]));
    const minY = Math.min(...cells.map(c => c[1]));
    const maxY = Math.max(...cells.map(c => c[1]));
    const w = (maxX - minX + 1) * size;
    const h = (maxY - minY + 1) * size;
    const offsetX = (nextCanvas.width - w) / 2;
    const offsetY = (nextCanvas.height - h) / 2;
    cells.forEach(([dx, dy]) => {
      const px = offsetX + (dx - minX) * size;
      const py = offsetY + (dy - minY) * size;
      nextCtx.fillStyle = COLORS[nextType];
      nextCtx.fillRect(px, py, size, size);
      nextCtx.strokeStyle = "rgba(0,0,0,0.35)";
      nextCtx.strokeRect(px + 0.5, py + 0.5, size - 1, size - 1);
    });
  }

  function render() {
    drawGrid();
    if (current) {
      drawGhost();
      drawCurrent();
    }
  }

  function updateStats() {
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
    comboEl.textContent = Math.max(combo, 0);
  }

  function showCombo(n, bonus) {
    if (n <= 0) return;
    comboPopupEl.innerHTML = `<strong>${n} COMBO!</strong><span>+${bonus}</span>`;
    comboPopupEl.hidden = false;
    comboPopupEl.classList.remove("show");
    void comboPopupEl.offsetWidth; // アニメーションを最初から再生し直す
    comboPopupEl.classList.add("show");
  }

  function lockPiece() {
    const cells = getCells(current);
    const aboveTop = cells.some(([, y]) => y < 0);
    cells.forEach(([x, y]) => {
      if (y >= 0) grid[y][x] = COLORS[current.type];
    });
    if (aboveTop) {
      triggerGameOver();
      return;
    }
    clearLines();
    spawnNext();
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell !== null)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      // 連続でラインを消すとコンボボーナス(2連続目から 50×コンボ数×レベル)
      combo++;
      if (combo > 0) {
        const bonus = 50 * combo * level;
        score += bonus;
        maxCombo = Math.max(maxCombo, combo);
        showCombo(combo, bonus);
      }
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel !== level) {
        level = newLevel;
        // レベルが1上がるごとに落下速度を10%速くする(間隔を1/1.1倍)
        dropInterval = Math.max(100, 1000 / Math.pow(1.1, level - 1));
      }
      updateStats();
    } else if (combo >= 0) {
      combo = -1;
      updateStats();
    }
  }

  function spawnNext() {
    if (bag.length === 0) bag = newBag();
    const type = nextType || bag.shift();
    if (bag.length === 0) bag = newBag();
    nextType = bag.shift();
    current = spawnPiece(type);
    drawNext();
    if (collides(current, 0, 0)) {
      triggerGameOver();
    }
  }

  function triggerGameOver() {
    if (gameOver) return;
    gameOver = true;
    running = false;
    const isNewRecord = score > highScore;
    if (isNewRecord) {
      highScore = score;
      saveHighScore(highScore);
      updateHighScoreDisplay();
    }
    newRecordEl.hidden = !isNewRecord;
    finalScoreEl.textContent = `スコア: ${score}`;
    finalHighScoreEl.textContent = `ハイスコア: ${highScore}`;
    finalMaxComboEl.textContent = `最大コンボ: ${maxCombo}`;
    gameOverOverlay.hidden = false;
    cancelAnimationFrame(rafId);
  }

  function hardDrop() {
    if (!running || paused || gameOver) return;
    let dist = 0;
    while (!collides(current, 0, dist + 1)) dist++;
    current.y += dist;
    score += dist * 2;
    updateStats();
    lockPiece();
    render();
  }

  function move(dx) {
    if (!running || paused || gameOver) return;
    if (!collides(current, dx, 0)) {
      current.x += dx;
      render();
    }
  }

  function softDrop() {
    if (!running || paused || gameOver) return;
    if (!collides(current, 0, 1)) {
      current.y += 1;
      score += 1;
      updateStats();
    } else {
      lockPiece();
    }
    render();
    dropTimer = 0;
  }

  function rotatePiece(dir) {
    if (!running || paused || gameOver) return;
    const newRotation = (current.rotation + dir + 4) % 4;
    const kicks = [0, -1, 1, -2, 2];
    for (const k of kicks) {
      if (!collides(current, k, 0, newRotation)) {
        current.x += k;
        current.rotation = newRotation;
        render();
        return;
      }
    }
  }

  function loop(time) {
    if (!running || paused || gameOver) return;
    if (!lastTime) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;
    dropTimer += delta;
    if (dropTimer > dropInterval) {
      dropTimer = 0;
      if (!collides(current, 0, 1)) {
        current.y += 1;
      } else {
        lockPiece();
      }
      render();
    }
    rafId = requestAnimationFrame(loop);
  }

  function resetGame() {
    grid = createGrid();
    bag = newBag();
    nextType = null;
    score = 0;
    lines = 0;
    level = 1;
    combo = -1;
    maxCombo = 0;
    comboPopupEl.hidden = true;
    dropInterval = 1000;
    dropTimer = 0;
    gameOver = false;
    paused = false;
    lastTime = 0;
    updateStats();
    spawnNext();
    render();
  }

  function startGame() {
    resetGame();
    running = true;
    startOverlay.hidden = true;
    gameOverOverlay.hidden = true;
    pauseOverlay.hidden = true;
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseOverlay.hidden = !paused;
    if (!paused) {
      lastTime = 0;
      rafId = requestAnimationFrame(loop);
    } else {
      cancelAnimationFrame(rafId);
    }
  }

  document.addEventListener("keydown", (e) => {
    if (["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," ","Spacebar"].includes(e.key)) {
      e.preventDefault();
    }
    if (e.key === "Enter") {
      if (!startOverlay.hidden || gameOver) startGame();
      return;
    }
    if (gameOver) return;
    switch (e.key) {
      case "ArrowLeft": move(-1); break;
      case "ArrowRight": move(1); break;
      case "ArrowDown": softDrop(); break;
      case "ArrowUp":
      case "x":
      case "X":
        rotatePiece(1);
        break;
      case "z":
      case "Z":
        rotatePiece(-1);
        break;
      case " ":
      case "Spacebar":
        hardDrop();
        break;
      case "p":
      case "P":
        togglePause();
        break;
    }
  });

  startBtn.addEventListener("click", startGame);
  retryBtn.addEventListener("click", startGame);
  resumeBtn.addEventListener("click", togglePause);
  pauseBtn.addEventListener("click", togglePause);
  titleBtn.addEventListener("click", showTitle);

  function showTitle() {
    gameOverOverlay.hidden = true;
    pauseOverlay.hidden = true;
    startOverlay.hidden = false;
    updateHighScoreDisplay();
  }

  document.querySelectorAll(".touch-controls button").forEach(btn => {
    btn.addEventListener("click", () => {
      const act = btn.dataset.act;
      if (act === "left") move(-1);
      else if (act === "right") move(1);
      else if (act === "down") softDrop();
      else if (act === "rotate") rotatePiece(1);
      else if (act === "drop") hardDrop();
    });
  });

  grid = createGrid();
  updateHighScoreDisplay();
  render();
})();
</script>

</body>
</html>
